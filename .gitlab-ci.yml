# .gitlab-ci.yml

stages:
  - build
  - test

build_back_end:
  stage: build
  image: python:3.12-slim
  script:
    - cd /builds/filny841/g10-tddd96-pum/cama_backend
    - pip install --upgrade pip
    - pip install -r requirements.txt



unit_test_back_end:
  stage: test
  image: python:3.12-slim
  script:
    - cd /builds/filny841/g10-tddd96-pum/cama_backend
    - pip install --upgrade pip
    - pip install -r requirements.txt
    - python -m pytest
    
  
