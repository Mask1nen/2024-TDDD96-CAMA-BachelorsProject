# .gitlab-ci.yml

stages:
  - build
  - test

build:
  stage: build
  image: python:3.12-slim
  script:
    - pip install --upgrade pip
    - pip install -r requirements.txt

unit_tests:
  stage: test
  image: python:3.12-slim
  script:
    - pip install --upgrade pip
    - pip install -r requirements.txt
    - python -m pytest
