# .gitlab-ci.yml

stages:
  - build
  - test

build_back_end:
  stage: build
  image: python:3.12-slim
  artifacts:
    paths:
      - cama_backend/tempenv
  cache:
    key: 'back_end'
    paths: 
      - cama_backend/tempenv
  script:
    - pip install virtualenv
    - cd cama_backend/
    - virtualenv tempenv
    - source tempenv/bin/activate
    - pip install --upgrade pip
    - pip install -r requirements.txt

test_back_end:
  stage: test
  image: python:3.12-slim
  needs: ['build_back_end']
  script:
    - cd cama_backend/
    - source tempenv/bin/activate
    - python -m pytest
    
  
