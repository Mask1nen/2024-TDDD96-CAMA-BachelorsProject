# .gitlab-ci.yml

stages:
  - build
  - test

build_back_end:
  stage: build
  image: python:3.12-slim
  cache:
    key: 'back_end_cache'
    paths: 
      - cama_backend/.venv
  script:
    - pip install virtualenv
    - cd /builds/filny841/g10-tddd96-pum/cama_backend
    - virtualenv .venv
    - source .venv/bin/activate
    - pip install --upgrade pip
    - pip install -r requirements.txt

test_back_end:
  stage: test
  image: python:3.12-slim
  needs: ['build_back_end']
  script:
    - cd /builds/filny841/g10-tddd96-pum/cama_backend
    - source .venv/bin/activate
    - python -m pytest
    
  
