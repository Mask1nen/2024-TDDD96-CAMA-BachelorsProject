stages:
  - build
  - test
before_script:
  python3 -m venv .venv
  source .venv/bin/activate
  pip install -r cama_backend/requirements.txt

build-job:
  stage: build
  image: python:3.12-slim
  script:
    - echo "Hello, $GITLAB_USER_LOGIN!"

run_tests:
  stage: test
  image: python:3.12-slim
  script:
    - pytest